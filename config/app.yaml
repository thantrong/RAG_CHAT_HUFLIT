# Cấu hình tầng ứng dụng: FastAPI backend + Streamlit UI.

api:
  host: 0.0.0.0
  port: 8000
  cors_allow_origins:
    - "*"

ui:
  # URL backend mà Streamlit gọi tới
  api_url: http://127.0.0.1:8000
  request_timeout: 120      # giây chờ câu trả lời từ backend
  health_check_timeout: 5

  # Câu hỏi gợi ý hiển thị ở sidebar
  suggestions:
    - "Nội quy phòng thi là gì?"
    - "Khi nào đóng học phí học kỳ 3?"
    - "Làm sao xin giấy xác nhận sinh viên?"
    - "Có những học bổng nào cho sinh viên?"
    - "Cách đăng ký học lại như thế nào?"
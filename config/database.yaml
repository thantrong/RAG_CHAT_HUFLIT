# Kết nối PostgreSQL + pgvector.
# MẬT KHẨU đọc từ biến môi trường DB_PASSWORD (trong .env) — không lưu ở đây.

postgres:
  host: localhost
  port: 5432
  database: student_rag
  username: postgres

vector:
  collection_name: student_rag
  distance_strategy: cosine
  use_jsonb: true
  extension: vector
  index_type: hnsw

hnsw:
  m: 16
  ef_construction: 64
  ef_search: 40
base_url: "https://portal.huflit.edu.vn/"

Path_Data: "/Users/thantrong/Code_TH/RAG_CHAT/cawl/data"

crawl_interval_hours: 6

max_concurrency: 5
request_timeout: 20

retry:
  enabled: true
  max_attempts: 3
  backoff_seconds: 2

content:
  remove:
    - nav
    - footer
    - script
    - style

download_attachments: true

allowed_types:
  - html
  - pdf
  - docx

# --- Trích xuất text từ file (PDF/DOCX) ---
extraction:
  timeout: 60          # giây tối đa để trích text MỘT file (quá giờ -> bỏ qua)

# --- Tải file bên ngoài (SharePoint / Google Drive) ---
external:
  session: huflit-sp   # tên browser session của agent-browser
  command_timeout: 60  # giây tối đa cho mỗi lệnh shell
  politeness_delay: 1  # giây nghỉ giữa các lần tải

# --- Cấu hình crawler: queue & frontiers (định danh URL qua hash) ---
crawler:
  enabled: true
  queue_backend: sqlite
  queue_path: crawler_queue.sqlite
  hash_algorithm: md5
  hash_length: 16
  canonicalize: true
  politeness_delay: 0.5
  max_pages_total: 0

